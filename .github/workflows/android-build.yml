name: Build Orbit Social APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Unpack Android project
        run: unzip -q OrbitSocial-Android-Project-Download.zip -d .

      - name: Change minimum Android SDK from 23 to 24
        run: sed -i 's/minSdk = 23/minSdk = 24/' orbit-social-android-project/app/build.gradle.kts

      - name: Check project files
        run: python orbit-social-android-project/scripts/preflight.py

      - name: Build debug APK
        run: gradle -p orbit-social-android-project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrbitSocial-Android-APK
          path: orbit-social-android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

    
